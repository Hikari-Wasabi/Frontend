<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safras</title> 
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/safras.css">
    <link rel="shortcut icon" type="imagex/png" href="./assets/imagem_wasabi_login.png">
</head>

<body onload="Listar_safras()">
    <!-- HEADER -->
    <header class="header">
        <div class="div_logo">
            <img src="../assets/logo.png" alt="logo wasabi">
        </div>
        <nav class="navbar">
            <span><a href="../index.html#section_home">Home</a></span>
            <span><a href="./simulacao.html">Simulação</a></span>
            <span><a href="./contato.html">Contato</a></span>
            <span><a href="../index.html#section_duvida">Dúvidas</a></span>
        </nav>
    </header>

    <h1 class="titulo_safra"><span id="usuario"></span></h1>
    <section class="section_main">
        <div class="container">
            <div class="div_logoWasabi">
                <img class="img_logo" src="../assets/logo.png" alt="imagem de wasabi">
            </div>
            <div class="div_safras" id="div_safras">
                
                <h1>Safras</h1>
                
        </div>
    </section>
    
    <footer>
        <div class="div_imgs">
            <img src="../assets/icon/iconeInstagram.svg" alt="icone instagram">
            <img src="../assets/icon/iconeFacebook.svg" alt="icone facebook">
            <img src="../assets/icon/iconeLinkedin.svg" alt="icone linkedin">
            <img src="../assets/icon/iconeEmail.svg" alt="icone email">
        </div>
        <div class="div_links">
            <ul>
                <li><a href="../index.html#section_home">Home</a></li>
                <li><a href="../pages/simulacao.html">Simulação</a></li>
                <li><a href="./contato.html">Contato</a></li>
                <li><a href="../index.html#section_duvida">Dúvidas</a></li>
            </ul>
        </div>
        <center>
            <span>Wasabi @ 2025</span>
        </center>
    </footer>
    
</body>

</html>

<script>
    usuario.innerHTML =  `Olá  ${sessionStorage.NOME_USUARIO}`
    function navegar() {
        window.location.href = "./dashboard.html"
    }
    // 

    
    function Listar_safras(){
    


    
    fetch(`http://127.0.0.1:3333/safra/mostrarSafra/${sessionStorage.EMAIL_USUARIO}/${sessionStorage.ID_USUARIO}`, 
    {  method: "GET"
    }).then(r => console.log(r)).then(function (response) {
            if (response.ok) {
                console.log("o codigo deu certo", response.idSafra)

                    var idsafra = response.idSafra
                    var idsensor = response.idsensor
                    var status_ativo = response.status_ativo

                    if(idsafra == undefined || idsensor == undefined || status_ativo == undefined){
                        div_safras.innerHTML += `<h1 style="color: red;">Nenhuma safra cadastrada!</h1>` 
                    }
                    else {
                    div_safras.innerHTML += ` <div class="container_cards">
                    <div onclick="navegar()" class="card-safra">
                        <img src="../assets/safra_wasabi2.jpeg" alt="imagem de wasabi">
                        <span>
                            <h2><span>SAFRA:</span> ${idsafra}</h2>
                            <p><span>Sensor:</span> ${idsensor}</p>
                            <p><span>Status:</span> ${status_ativo}</p>
                            <p><span>Modelo:</span> Arduino Uno R3</p>
                        </span>
                    </div>` 
                }
 

            
                
            } else {
                console.log('Nenhum dado encontrado ou erro na API');
            }
    })

}

    
        
</script>
