<script>
    var usuario = sessionStorage.NOME_USUARIO
    var idsensor = 0
    function navegar(idsensor) {
        window.location.href = "./dashboard.html"
        console.log(idsensor);
        sessionStorage.ID_SENSOR = idsensor

    }
    // 


    function Listar_safras() {


        var email = sessionStorage.EMAIL_USUARIO
        var id_usuario = sessionStorage.ID_USUARIO

        fetch(`/safra/mostrarSafra/${email}/${id_usuario}`, {
            method: "GET",
        }).then(function (response) {
            if (response.ok) {
                return response.json();
            } else {
                console.log("Erro na api")
            }
        }).then(function (response) {


            if (response.length == 0) {
                div_safras.innerHTML += `<h1 style="color: red;">Nenhuma safra cadastrada!</h1>`
            }



            console.log("o codigo deu certo", response.idSafra)

            var idsafra = 0

            var status_ativo = 0
            /* Armazenamento na Session Storage */


            console.log(response)

            for (i = 0; i < response.length; i++) {

                idsafra = response[i].idSafra
                idsensor = response[i].idsensor
                status_ativo = response[i].status_ativo
                console.log(idsensor)

                div_safras.innerHTML += `
                    <div onclick="navegar(${idsensor})" class="card-safra">
                        <img src="../assets/safra_wasabi2.jpeg" alt="imagem de wasabi">
                        <span>
                            <h2><span>SAFRA:</span> ${idsafra}</h2>
                            <p><span>Sensor:</span> ${idsensor}</p>
                            <p><span>Status:</span> ${status_ativo}</p>
                            <p><span>Modelo:</span> Arduino Uno R3</p>
                        </span>
                    </div>                    
                    `

            }

        })

    }



</script>
