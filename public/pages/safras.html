    <!-- HEADER -->

<script>
    var usuario = sessionStorage.NOME_USUARIO
    var idsensor = 0

    // obterSituacaoSafras()
    function navegar(idsensor, idSafra) {
        window.location.href = "./dashboard.html"
        console.log(idsensor);
        sessionStorage.ID_SENSOR = idsensor

        console.log(idSafra);
        sessionStorage.ID_SAFRA = idSafra
    }
    // 

    var listaSafrasAdequadas = []
    var listaSafrasCriticas = []
    var listaTodasSafras = []

    function obterSituacaoSafras() {
        var id_usuario = sessionStorage.ID_USUARIO
        fetch(`/safra/obter-situacao-safra/${id_usuario}`, {
            method: "GET",
        }).then(function(response) {
            if (response.ok) {
                return response.json();
            } else {
                console.log("Erro na api")
            }
        }).then(function(response) {


            if (response.length == 0) {
                // div_safras.innerHTML += `<h1 style="color: red;">Nenhuma safra cadastrada!</h1>`
            }

            var idsafra = 0

            var status_ativo = 0
            /* Armazenamento na Session Storage */


            console.log(response)

            for (var i = 0; i < response.length; i++) {
                console.log(response[i])

                if (response[i].situacao_safra == 'adequado') {
                    listaSafrasAdequadas.push(response[i])
                } else {
                    listaSafrasCriticas.push(response[i])
                }
            }


            var conteudoSafraCritica = ``
            if (listaSafrasCriticas.length == 0) {

                conteudoSafraCritica = `<h1> Nenhuma safra instável / crítica </h1>`
            } else {
                conteudoSafraCritica = ``
            }
            for (var i = 0; i < listaSafrasCriticas.length; i++) {
                listaTodasSafras.push(listaSafrasCriticas[i])
                conteudoSafraCritica += `
                                    <button onclick="navegar(${listaSafrasCriticas[i].idsensor}, ${listaSafrasCriticas[i].idSafra})" class="btn-lista">
                                        <span>Safra #${listaSafrasCriticas[i].idSafra}</span>
                                        <p>Sensor #${listaSafrasCriticas[i].idsensor}</p>
                                        <div>
                                            <img src="
                                                ${(listaSafrasCriticas[i].situacao_temperatura == "adequado" && "../assets/sunny.png")
                    ||
                    "../assets/notSunny.png"
                    }
                                            " alt="Temperatura adequada">
                                            <img src="
                                                ${(listaSafrasCriticas[i].situacao_umidade == "adequado" && "../assets/drop.png")
                    ||
                    "../assets/notDrop.png"
                    }
                                            " alt="Umidade adequada">
                                        </div>
                                    </button>
                                `
            }

            var conteudoSafraAdequada = ``
            if (listaSafrasAdequadas.length == 0) {
                conteudoSafraAdequada = `<h1> Nenhuma safra adequada </h1>`
            } else {
                conteudoSafraAdequada = ``
            }
            for (var i = 0; i < listaSafrasAdequadas.length; i++) {
                response.push(listaSafrasAdequadas[i])
                conteudoSafraAdequada += `
                    <button onclick="navegar(${listaSafrasAdequadas[i].idsensor}, ${listaSafrasAdequadas[i].idSafra})" class="btn-lista">
                        <span>Safra #${listaSafrasAdequadas[i].idSafra}</span>
                        <p>Sensor #${listaSafrasAdequadas[i].idsensor}</p>
                        <div>
                            <img src="../assets/sunny.png" alt="Temperatura adequada">
                            <img src="../assets/drop.png" alt="Umidade adequada">
                        </div>
                    </button>
                `
            }

            div_situacao_safra_adequado.innerHTML += conteudoSafraAdequada
            div_situacao_safra_critica.innerHTML += conteudoSafraCritica
            Listar_safras()
        })

    }

    function Listar_safras() {




        var id_usuario = sessionStorage.ID_USUARIO

        fetch(`/safra/mostrarSafra/${id_usuario}`, {
            method: "GET",
        }).then(function(response) {
            if (response.ok) {
                return response.json();
            } else {
                console.log("Erro na api")
            }
        }).then(function(response) {


            if (response.length == 0) {
                div_safras.innerHTML += `<h1 style="color: red;">Nenhuma safra cadastrada!</h1>`
            }



            console.log("o codigo deu certo")

            var idsafra = 0

            var status_ativo = 0
            /* Armazenamento na Session Storage */


            console.log(response)





            if (response.length == 0) {
                div_safras.innerHTML += `<h1 style="color: red;">Nenhuma safra cadastrada!</h1>`
            }

            for (var i = 0; i < response.length; i++) {
                console.log(response[i]);

                idsafra = response[i].idSafra
                idsensor = response[i].idsensor
                var status_ativo = response[i].status_ativo
                var situacao_safra = response[i].situacao_safra;
                var modelo_safra = response[i].modelo;

                if (status_ativo == 1) {
                    status_ativo = 'Ativo'
                } else {
                    status_ativo = 'Desativado'
                }

                var mensagem_safra = ""

                if (situacao_safra === 'critico' || situacao_safra === 'instavel') {
                    mensagem_safra += ` 
        <div onclick="navegar(${idsensor}, ${idsafra})" class="card-safra critico">
            <img src="../assets/safra_wasabi2.jpeg" alt="imagem de wasabi">
            <span>
                <h2><span>SAFRA:</span> ${idsafra}</h2>
                <p><span>Sensor:</span> ${idsensor}</p>
                <p><span>Status:</span> ${status_ativo}</p>
                <p><span>Modelo:</span> Arduino ${modelo_safra}</p>
            </span>
        </div>                   
    `;
                } else {
                    mensagem_safra += `
        <div onclick="navegar(${idsensor}, ${idsafra})" class="card-safra">
            <img src="../assets/safra_wasabi2.jpeg" alt="imagem de wasabi">
            <span>
                <h2><span>SAFRA:</span> ${idsafra}</h2>
                <p><span>Sensor:</span> ${idsensor}</p>
                <p><span>Status:</span> ${status_ativo}</p>
                <p><span>Modelo:</span> Arduino ${modelo_safra}</p>
            </span>
        </div>                    
    `
                }
                div_safras.innerHTML += mensagem_safra;
            }

        })
    }
</script>
