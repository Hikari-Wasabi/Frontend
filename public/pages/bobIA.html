<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="../styles/bobIA.css">
</head>
<body>

    <header class="header">
        <div class="div_logo">
            <img src="../assets/logo.png" alt="logo wasabi">
        </div>
        <nav class="navbar">
            <span><a href="../index.html#section_home">Home</a></span>
            <span><a href="./simulacao.html">Simulação</a></span>
            <span><a href="#">Contato</a></span>
            <span><a href="../index.html#section_duvida">Dúvidas</a></span>
        </nav>
        <div class="div_authButtons">
            <a href="./login.html">Login</a>
            <a href="./cadastro.html">Registrar</a>
        </div>
    </header>


    <h1 style="display: flex; align-items: center; justify-content: center;">WasabIA</h1>    

    <div class="container-IA">
        <div class="container-questions">
            <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
            <div class="container-button">
            <button onclick="gerarResposta()">Gerar Resposta</button>
            </div>
            <h3>Resposta da IA:</h3>
            <div id="resposta"></div>


        </div>
    </div>

    <script>
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/bob-ia/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>
</html>
