<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

  <header class="header">
    <div class="div_logo">
      <img src="../assets/logo.png" alt="logo wasabi">
    </div>
    <nav class="navbar">
      <span><a href="../index.html#section_home">Home</a></span>
      <span><a href="./simulacao.html">Simulação</a></span>
      <span><a href="./contato.html">Contato</a></span>
      <span><a href="../index.html#section_duvida">Dúvidas</a></span>
    </nav>
    <div class="div_authButtons">
      <a href="./login.html">Login</a>
      <a href="#">Registrar</a>
    </div>
  </header>

  <section class="section_main">
    <div class="container">

      <form id="pg1">
        <h1>Cadastre-se!</h1>
        <div class="container_inputs">

          <label>Token</label>
          <input type="text" id="input_token" placeholder="Insira o Token">

          <label>Nome</label>
          <input type="text" id="input_nome" placeholder="Insira o nome">

          <label>Telefone</label>
          <input type="text" id="input_telefone" placeholder="Insira o telefone" maxlength="11">

          <label>Email</label>
          <input type="text" id="input_email" placeholder="Insira o email">

          <label>Senha</label>
          <input type="password" id="input_senha" placeholder="Insira a senha">

          <label>Confirmar Senha</label>
          <input type="password" id="input_Confsenha" placeholder="Confirme a senha">

          <p id="mensagemErro1" style="display:none; color:red"></p>
        </div>
        <center>
          <button type="button" onclick="cadastrar()">Cadastrar</button>
        </center>
      </form>


      <div class="div_imagem">
        <img src="../assets/logo.png" alt="imagem wasabi">
        <h2>precisão que cabe em qualquer safra</h2>
      </div>
    </div>
  </section>
  <footer>
    <div class="div_imgs">
      <img src="../assets/icon/iconeInstagram.svg" alt="icone instagram">
      <img src="../assets/icon/iconeFacebook.svg" alt="icone facebook">
      <img src="../assets/icon/iconeLinkedin.svg" alt="icone linkedin">
      <img src="../assets/icon/iconeEmail.svg" alt="icone email">
    </div>
    <div class="div_links">
      <ul>
        <li><a href="../index.html#section_home">Home</a></li>
        <li><a href="../pages/simulacao.html">Simulação</a></li>
        <li><a href="./contato.html">Contato</a></li>
        <li><a href="../index.html#section_duvida">Dúvidas</a></li>
      </ul>
    </div>
    <center>
      <span>Wasabi @ 2025</span>
    </center>
  </footer>

  <script>
    function cadastrar() {
      var tokenVar = input_token.value.trim();
      var nomeVar = input_nome.value.trim();
      var telefoneVar = input_telefone.value.trim();
      var emailVar = input_email.value.trim();
      var senhaVar = input_senha.value;
      var ConfsenhaVar = input_Confsenha.value;
      var houveErro = false;

      mensagemErro1.style.display = 'none';
      mensagemErro1.innerHTML = '';

      if (tokenVar == "" || nomeVar == "" || telefoneVar == "" || emailVar == "" || senhaVar == "" || ConfsenhaVar == "") {
        houveErro = true;
        mensagemErro1.innerHTML += "Não podem ter campos vazios!";
      }

      if ( !emailVar.includes("@") || !emailVar.endsWith(".com") || emailVar.indexOf("@") === 0 || emailVar.indexOf("@") === emailVar.length - 5 || emailVar[emailVar.indexOf("@") + 1] === '.'
      ) {
        houveErro = true;
        mensagemErro1.innerHTML += "<br>Email está em formato incorreto!";
      }

      var temMaiuscula = false;
      var temMinuscula = false;
      var temNumero = false;
      var temEspecial = false;
      var i = 0;

      while (i < senhaVar.length) {
        var c = senhaVar[i];
        if (c >= "A" && c <= "Z") temMaiuscula = true;
        else if (c >= "a" && c <= "z") temMinuscula = true;
        else if (c >= "0" && c <= "9") temNumero = true;
        else temEspecial = true;
        i = i + 1;
      }

      if (senhaVar.length < 8 || !temMaiuscula || !temMinuscula || !temNumero || !temEspecial) {
        houveErro = true;
        mensagemErro1.innerHTML += "<br> Senha Fraca! Mínimo 8 caracteres, com Maiúscula, Minúscula, Número e Especial.";
      }

      if (ConfsenhaVar !== senhaVar) {
        houveErro = true;
        mensagemErro1.innerHTML += "<br> Confirmação de senha inválida!";
      }

      if (houveErro) {
        mensagemErro1.style.display = 'block';
        return;
      }

      fetch("/empresas/listar", {                                   /* Usa a rota expressa na API pra puxar os dados */
        method: "GET",                                              
      })
        .then(function (resposta) {
          if (resposta.ok) {
            resposta.json().then(function (json) {
              var idEmpresaVincular = null;

              var token = []

              for (var i = 0; i < json.length; i++){
                token.push(json[i].token)
                console.log(`${token}`)
                if (json[i].token == tokenVar) {          /* Busca o id da empresa pelo token, o idEmpresaVincular = fk.empresa na tabela funcionario */
                  idEmpresaVincular = json[i].idEmpresa;
                  break;
                }
              }

              if (idEmpresaVincular == null) {
                mensagemErro1.style.display = 'block';
                mensagemErro1.innerHTML = "O Token está inválido! Cadastro não realizado.";   
                return;
              }

              var telefoneFormatado = telefoneVar;
              if (telefoneVar.length == 11) {
                telefoneFormatado = "(" + telefoneVar.substring(0, 2) + ") " +
                  telefoneVar.substring(2, 7) + "-" +
                  telefoneVar.substring(7, 11);
              }

              fetch("/usuarios/cadastrar", {
                method: "POST",                                    /* Envia os dados requisição POST */
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  nomeServer: nomeVar,
                  emailServer: emailVar,                          /* Converte o Js para Json */
                  senhaServer: senhaVar,
                  telefoneServer: telefoneFormatado,
                  idEmpresaVincularServer: idEmpresaVincular
                }),
              })
                .then(function (respostaCadastro) {
                  if (respostaCadastro.ok) {
                    mensagemErro1.style.display = "block";
                    mensagemErro1.style.color = "green";
                    mensagemErro1.innerHTML = "Cadastro realizado com sucesso! Redirecionando para Login...";

                    setTimeout(function () {
                      window.location.href = "./login.html";                /* Redirect para o login */
                    }, "2000");

                  } else {
                    respostaCadastro.text().then(function (texto) {
                      mensagemErro1.style.display = "block";             /* Apresenta o erro ocorrido no console, caso exista */
                      mensagemErro1.style.color = "red";
                      mensagemErro1.innerHTML = "Houve um erro ao tentar realizar o cadastro! <br> Detalhes: " + texto;
                    });
                  }
                })
                .catch(function (erroCadastro) {
                  console.log("ERRO no POST de cadastro: ", erroCadastro);
                  mensagemErro1.style.display = "block";
                  mensagemErro1.style.color = "red";
                  mensagemErro1.innerHTML = "Erro de rede ao cadastrar. Verifique a API.";
                });
            });

          } else {
            mensagemErro1.style.display = 'block';
            mensagemErro1.innerHTML = "Erro ao buscar a lista de empresas (Token). Tente novamente.";
            return;
          }
        })
        .catch(function (erroListar) {
          console.log("ERRO no GET de listar empresas: ", erroListar);
          mensagemErro1.style.display = 'block';
          mensagemErro1.innerHTML = "Erro de conexão ao validar Token. Verifique a API.";
        });
    };
  </script>
</body>

</html>
